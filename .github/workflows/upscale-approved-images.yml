name: Upscale approved Pocket Goat photography

on:
  push:
    branches:
      - staging/initial-build
    paths:
      - ".github/workflows/upscale-approved-images.yml"
      - "public/images/pocket-goat/penultimate/*.webp"
      - "public/images/pocket-goat/books/*.webp"

permissions:
  contents: write

jobs:
  upscale:
    if: ${{ !contains(github.event.head_commit.message, '[hires-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: staging/initial-build
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Upscale approved images
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFilter

          targets = {
              Path("public/images/pocket-goat/penultimate/master.webp"): 1600,
              Path("public/images/pocket-goat/penultimate/pockets-wall.webp"): 1600,
              Path("public/images/pocket-goat/penultimate/pocket-detail.webp"): 1500,
              Path("public/images/pocket-goat/penultimate/root-table.webp"): 1500,
              Path("public/images/pocket-goat/books/books-hero.webp"): 1600,
              Path("public/images/pocket-goat/books/books-recommendations.webp"): 1500,
              Path("public/images/pocket-goat/books/books-dobrogea.webp"): 1500,
              Path("public/images/pocket-goat/books/book-stack-real.webp"): 1500,
          }

          for path, max_side in targets.items():
              name = path.name
              with Image.open(path) as src:
                  image = src.convert("RGB")
              scale = max_side / max(image.size)
              if scale <= 1:
                  print(f"{name}: already {image.size}, no resize needed")
                  continue

              size = (round(image.width * scale), round(image.height * scale))
              image = image.resize(size, Image.Resampling.LANCZOS)
              image = image.filter(ImageFilter.UnsharpMask(radius=1.15, percent=115, threshold=2))
              image.save(path, "WEBP", quality=88, method=6)
              print(f"{name}: -> {size}")
          PY

      - name: Commit high-resolution assets
        run: |
          if git diff --quiet -- public/images/pocket-goat/penultimate public/images/pocket-goat/books; then
            echo "No image changes."
            exit 0
          fi
          git config user.name "Pocket Goat CI"
          git config user.email "actions@users.noreply.github.com"
          git add public/images/pocket-goat/penultimate public/images/pocket-goat/books
          git commit -m "assets: upscale approved photography [hires-generated]"
          git push origin HEAD:staging/initial-build
